version: 1
default_language: zh-CN

normalization:
  description: 飞书、群聊和移动端入口可用中文触发词；gateway 或 Archie wrapper 将命中的别名归一化为 Hermes skill 命令。
  prefix_formats:
    - "<alias>：<task>"
    - "<alias>: <task>"
    - "#<alias> <task>"
    - "用<alias><task>"
  fallback: 未命中别名时交给 Archie 默认 agent，不强制加载特定 skill。

skills:
  - name: cog-socrates
    command: /cog-socrates
    path: personas/philosophy/socrates/SKILL.md
    aliases: [苏格拉底, 追问, 问题澄清, 澄清问题, 前提检查]

  - name: cog-aristotle
